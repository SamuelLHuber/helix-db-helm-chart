apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helixdb.fullname" . }}
  labels:
    {{- include "helixdb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "helixdb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helixdb.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-minio
          image: "{{ .Values.minio.mcImage.repository }}:{{ .Values.minio.mcImage.tag }}"
          imagePullPolicy: {{ .Values.minio.mcImage.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for MinIO to be ready..."
              until mc alias set local http://{{ include "helixdb.fullname" . }}-minio:9000 {{ .Values.minio.rootUser }} {{ .Values.minio.rootPassword }} 2>/dev/null; do
                echo "MinIO not ready yet, retrying..."
                sleep 2
              done
              # Ensure bucket exists (it may be created by the hook, but create if missing)
              mc mb --ignore-existing local/{{ .Values.minio.bucket }}
              mc ls local/{{ .Values.minio.bucket }} >/dev/null 2>&1
              echo "MinIO ready and bucket exists"
      containers:
        - name: helixdb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: S3_BUCKET
              value: "{{ .Values.minio.bucket }}"
            - name: S3_REGION
              value: "{{ .Values.minio.region }}"
            - name: DB_PATH
              value: "db/"
            - name: AWS_ACCESS_KEY_ID
              value: "{{ .Values.minio.rootUser }}"
            - name: AWS_SECRET_ACCESS_KEY
              value: "{{ .Values.minio.rootPassword }}"
            - name: AWS_ENDPOINT
              value: "http://{{ include "helixdb.fullname" . }}-minio:9000"
            - name: AWS_ALLOW_HTTP
              value: "true"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helixdb.fullname" . }}
  labels:
    {{- include "helixdb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "helixdb.selectorLabels" . | nindent 4 }}
